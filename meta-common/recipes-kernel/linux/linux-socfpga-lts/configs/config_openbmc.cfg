# Kernel namespaces — required for systemd sandboxing features used by
# OpenBMC services (dbus-broker PrivateTmp/PrivateDevices/ProtectSystem,
# bmcweb TemporaryFileSystem, phosphor-* services).
# Without these, systemd returns ENOTDIR when spawning sandboxed services
# and the entire D-Bus stack fails to start at boot.
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_MNT_NS=y

# HWMON and thermal framework — required for dbus-sensors (hwmontempsensor)
# to discover and read soc64-hwmon temperature sensors, and for the
# axi-fan-control hwmon driver to register its fan1_input/pwm1 attributes.
# THERMAL_WRITABLE_TRIPS allows threshold modification at runtime.
CONFIG_HWMON=y
CONFIG_THERMAL=y
CONFIG_THERMAL_OF=y
CONFIG_THERMAL_WRITABLE_TRIPS=y

# ---------------------------------------------------------------------------
# Step 1 (D1) — MikroE Click sensors over the Pi 2 Click Shield
# ---------------------------------------------------------------------------
# IMPORTANT: in Shi Lin's bitstream the Pi-header sensor SDA/SCL balls
# (AJ24/AJ23) are wired to the HPS *I3C* controller (baseline_a55.qsf:
# i3c_sda/i3c_scl), NOT a DesignWare I2C controller. The MikroE Click sensors
# are I2C parts, so they sit on the I3C0 bus in *legacy-I2C* mode.
#
# DesignWare I3C master — the controller the Click sensors are actually on
# (i3c0 @ 0x10da0000, enabled in baseline_a55.dts).
CONFIG_I3C=y
CONFIG_DW_I3C_MASTER=y

# DesignWare I2C — kept for the on-board ID EEPROM path (id_sd/id_sc) and for
# /dev/i2c-N (i2cdetect/i2cget) during bring-up.
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_I2C_CHARDEV=y

# AT24 EEPROM driver for the Altera sensor board HAT ID EEPROM (CAT24C32 @ 0x50
# on HPS I2C1). Binds the eeprom@50 DTS node, exposing
# /sys/bus/i2c/devices/<bus>-0050/eeprom; fru-device reads its IPMI FRU.
CONFIG_EEPROM_AT24=y

# lm75.c — temperature driver for the Thermo 10 Click (NXP P3T1755). Supports
# p3t1755 both as an I2C device (i2c id "p3t1755", incl. legacy-I2C-on-I3C) and
# as a native I3C device (module_i3c_i2c_driver, lm75_i3c_* in our tree).
# dbus-sensors instantiates it from the entity-manager "P3T1755" Exposes entry
# (see entity-config.json + the dbus-sensors P3T1755 type patch). See D1 / D3.1.
CONFIG_SENSORS_LM75=y

# ---------------------------------------------------------------------------
# Step 5 (D5) — MikroE Accel 23 Click (MIKROE-6664), ST IIS2DULPX 3-axis
# accelerometer, wired to the HPS SPI master SPIM0 (spi0 @ 0x10da4000) in Shi
# Lin's bitstream: ACC_MOSI=AJ22, ACC_MISO=AH20, ACC_SCK=AJ20, ACC_CS#=AG23
# (CS0), ACC_INT=AH23 — see baseline_a55.qsf / Altera sensor-board interface.
#
# There is no in-tree (or upstream) IIS2DULPX driver, so we drive it from a
# small userspace daemon (iis2dulpx-accel) over /dev/spidev0.0. That needs the
# DesignWare SPI master controller and the generic spidev chardev built in (the
# base defconfig has them as modules; force =y so they are present at boot
# without relying on udev modalias autoload). The accel child node binds spidev
# via the allow-listed "rohm,dh2228fv" compatible (see baseline_a55.dts).
CONFIG_SPI=y
CONFIG_SPI_MASTER=y
CONFIG_SPI_DESIGNWARE=y
CONFIG_SPI_DW_MMIO=y
CONFIG_SPI_SPIDEV=y

# ---------------------------------------------------------------------------
# I3C bring-up visibility — CONFIG_DYNAMIC_DEBUG lets us turn on verbose
# drivers/i3c/master.c + dw-i3c-master logging at runtime via
# /sys/kernel/debug/dynamic_debug/control, so DAA / SETDASA / ENTDAA
# transactions and NACK/timeout errors become visible when a sensor (e.g. a
# TSC1641 power meter) fails to enumerate. CONFIG_DEBUG_FS is already on in the
# base defconfig (debugfs mounts), but the dynamic_debug control file only
# appears with this enabled.
# ---------------------------------------------------------------------------
CONFIG_DYNAMIC_DEBUG=y
