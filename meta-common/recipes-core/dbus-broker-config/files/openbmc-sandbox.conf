[Service]
# Disable sandbox options that require mount namespace kernel support.
# These are re-enabled automatically once CONFIG_MNT_NS is present in the
# kernel (enabled via meta-custom config_openbmc.cfg).  Without this override
# the entire D-Bus stack fails to start on first boot and cascades to all
# phosphor-* services failing with "Not a directory" spawn error.
ProtectSystem=no
PrivateTmp=no
PrivateDevices=no
