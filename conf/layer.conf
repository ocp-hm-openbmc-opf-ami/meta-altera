# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "altera-layer"
BBFILE_PATTERN_altera-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_altera-layer = "7"

# Depends on:
#   phosphor-layer  — meta-phosphor (OpenBMC core)
#   altera-bsp      — meta-altera-bsp sublayer embedded inside meta-altera/
#                     Provides: linux-socfpga-lts, u-boot-socfpga, arm-trusted-firmware,
#                               conf/machine/include/socfpga_armv8-2a.inc, device-tree,
#                               fpga-bitstream, u-boot-socfpga-scr, u-boot-socfpga-env-var
LAYERDEPENDS_altera-layer = "phosphor-layer altera-bsp"

LAYERSERIES_COMPAT_altera-layer = "walnascar"
