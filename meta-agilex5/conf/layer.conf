# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "altera-agilex5"
BBFILE_PATTERN_altera-agilex5 = "^${LAYERDIR}/"
BBFILE_PRIORITY_altera-agilex5 = "8"

# Depends on altera-layer (meta-altera OpenBMC integration) and the BSP
# Also depends on meta-ami (collection: meta-ami) for obmc-phosphor-image base,
# obmc-onetree-apps class, and AMI OpenBMC package groups/services.
# Depends on meta-core/meta-common (collection: common) for phosphor-* services,
# sensors, network, IPMI, certificate, host-error-monitor, and core utilities.
LAYERDEPENDS_altera-agilex5 = "altera-common phosphor-layer altera-layer altera-bsp meta-ami common"

LAYERSERIES_COMPAT_altera-agilex5 = "walnascar"

# meta-altera-platform/recipes-core/systemd_%.bbappend references a GSRD-only
# patch that is absent in the OpenBMC source tree — mask it to avoid parse errors.
BBMASK += " meta-altera-platform/recipes-core/ "
BBMASK += " meta-altera-platform/recipes-devtools/ "
