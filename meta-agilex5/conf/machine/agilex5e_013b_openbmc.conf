#@TYPE: Machine
#@NAME: Altera SoCFPGA Agilex5E 013B OpenBMC
#@DESCRIPTION: Machine configuration for Agilex 5E 013B SoCFPGA (DK-A5E013BM16AEA) running OpenBMC
#
# Derived from agilex5e_013b.conf (GSRD) — removes GSRD-only items
# (multilib, ubifs/jffs2, XEN, extlinux, sysvinit conditionals) and adds
# OpenBMC-specific settings (phosphor distro features, wic+tar.xz image types).
#
# Inheritance chain:
#   socfpga_armv8-2a.inc  (CPU/SoC arch — from meta-altera-bsp via BBPATH)
#       └── agilex5e_013b_openbmc.conf  (this file)

require conf/machine/include/socfpga_armv8-2a.inc

# ---------------------------------------------------------------------------
# Root home directory
# ---------------------------------------------------------------------------
ROOT_HOME = "/home/root"

# ---------------------------------------------------------------------------
# Machine name strip — must match baseline agilex5e_013b.conf value so that
# meta-altera-bsp finds fit_agilex5_kernel.its (not fit_agilex5e_013b_kernel.its)
# ---------------------------------------------------------------------------
MACHINE_STRIP = "agilex5"

# ---------------------------------------------------------------------------
# Boot source — SD card (mmc0) for Phase 0
# ---------------------------------------------------------------------------
SSBL_BOOT_SOURCE ??= "mmc0"

# ---------------------------------------------------------------------------
# U-Boot
# ---------------------------------------------------------------------------
UBOOT_CONFIG = "agilex5e-013b-socdk-atf"
UBOOT_CONFIG[agilex5e-013b-socdk-atf] = "${UBOOT_DEFCONFIG}"
UBOOT_DEFCONFIG ?= "socfpga_agilex5_013b_defconfig"

KBUILD_DEFCONFIG ?= "defconfig"

UBOOT_BINARY  = "u-boot.itb"
UBOOT_SUFFIX  = "itb"
UBOOT_DEVICE_TREE ?= "socfpga_agilex5_socdk_013b.dtb"

UBOOT_ENTRYPOINT  = "0x4000000"
UBOOT_LOADADDRESS = "0x4000000"

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------
KERNEL_IMAGETYPE = "Image"
FIT_KERNEL_COMP_ALG = "none"

LINUX_DTS_FILE     ?= "socfpga_agilex5_socdk_013b.dts"
LINUX_DTB_FILE     ?= "socfpga_agilex5_socdk_013b.dtb"

CUSTOM_LINUX_DTS_FILE ?= ""

KERNEL_DEVICETREE ?= "intel/${LINUX_DTB_FILE}"

# ---------------------------------------------------------------------------
# Serial console
# ---------------------------------------------------------------------------
SERIAL_CONSOLES ?= "115200;ttyS0"

# ---------------------------------------------------------------------------
# Extra dependencies (from meta-altera-bsp)
# ---------------------------------------------------------------------------
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = " device-tree fpga-bitstream"

# Auto-load the ADI AXI fan-control hwmon driver so dbus-sensors / fansensor
# can discover /sys/class/hwmon/hwmonN/fan1_input and pwm1 from FPGA AXI fan IP.
KERNEL_MODULE_AUTOLOAD:append = " axi-fan-control"

EXTRA_IMAGEDEPENDS:append = " \
    u-boot-socfpga-scr \
    u-boot-socfpga-env-var \
    "

# ---------------------------------------------------------------------------
# OpenBMC / phosphor distro requirements
# ---------------------------------------------------------------------------
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"

VIRTUAL-RUNTIME_obmc-host-state-manager    ?= "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager ?= "x86-power-control"
VIRTUAL-RUNTIME_obmc-discover-system-state  = ""

DISTRO_FEATURES:append = " systemd usrmerge"

# Hostless BMC: remove host-IPMI and host-control features so their
# FEATURE_PACKAGES are not pulled into the image.
DISTRO_FEATURES:remove = "obmc-host-ipmi obmc-host-ctl"

# Prevent phosphor-ipmi-host's RRECOMMENDS chain from pulling in
# phosphor-ipmi-fru via packagegroup-obmc-ipmid-providers-libs.
VIRTUAL-RUNTIME_phosphor-ipmi-providers = ""

# Suppress net-IPMI (RMCP) feature packages — hostless platforms cannot run RMCP.
FEATURE_PACKAGES_obmc-net-ipmi:agilex5e_013b_openbmc = ""

# Explicit virtual provider declarations
PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-apps"
PREFERRED_PROVIDER_virtual/obmc-fan-mgmt     = "packagegroup-apps"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt   = "packagegroup-apps"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt  = "packagegroup-apps"

MACHINE_FEATURES += " \
    obmc-bmc-state-mgmt \
    obmc-phosphor-flash-mgmt \
    obmc-phosphor-fan-mgmt \
    "

# ---------------------------------------------------------------------------
# SD card image (wic) — OpenBMC-specific layout
# 256 MB FAT boot + 1024 MB ext4 rootfs
# ---------------------------------------------------------------------------
WKS_FILE = "sdimage-agilex5e-013b-openbmc.wks"
IMAGE_FSTYPES = "wic tar.xz"
IMAGE_FEATURES:append = " allow-empty-password empty-root-password"

do_image_wic[depends] += " \
    mtools-native:do_populate_sysroot \
    dosfstools-native:do_populate_sysroot \
    virtual/bootloader:do_deploy \
    virtual/kernel:do_deploy \
    "
