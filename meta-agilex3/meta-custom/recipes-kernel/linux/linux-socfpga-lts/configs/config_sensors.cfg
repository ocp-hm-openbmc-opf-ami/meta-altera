CONFIG_SENSORS_SOC64=y
# ADI AXI fan control driver (adi,axi-fan-control-1.00.a)
CONFIG_SENSORS_AXI_FAN_CONTROL=m
# regmap-i3c backs the native-I3C transport for the vendored TSC1641 power
# monitor (Current 12 Click) on the HPS DesignWare I3C bus. CONFIG_I3C and the
# DW master are already enabled (the P3T1755 binds via lm75_i3c).
CONFIG_REGMAP_I3C=y