# Ensure bmcweb starts AFTER the TLS server certificate has been generated.
#
# On first boot /etc/ssl/certs/https/server.pem does not exist.
# phosphor-certificate-manager@bmcweb.service creates (or restores) that
# certificate before signalling bmcweb to start.  Without this ordering
# bmcweb races against the certificate generator, SEGV-crashes because
# ssl::context::use_certificate_file() cannot open the missing PEM file,
# hits systemd's restart rate-limit (5 attempts in 10 s), and stays in
# the "failed" state — making the web UI permanently unavailable until
# the operator manually does: systemctl reset-failed bmcweb && systemctl start bmcweb
#
# With this drop-in: bmcweb.service waits for phosphor-certificate-manager
# to complete on every boot (cost is negligible — cert-manager runs in <1 s
# when the certificate already exists).
[Unit]
After=phosphor-certificate-manager@bmcweb.service
Wants=phosphor-certificate-manager@bmcweb.service
After=first-boot-set-priv.service
Wants=first-boot-set-priv.service
