#@TYPE: Machine
#@NAME: Altera SoCFPGA Agilex 3 C-Series OpenBMC
#@DESCRIPTION: Machine configuration for Agilex 3 C-Series SoCFPGA (DK-A3W135BM16AEA) running OpenBMC
#
# Hardware: Dual Arm Cortex-A55 (ARMv8.2-A), device A3CW135BM16AE6S
#
# Derived from the reference meta-altera-openbmc/agilex3_openbmc.conf shipped
# with the GSRD bmc-demo-lth design.  GSRD-only items (multilib, ubifs/jffs2,
# XEN, extlinux, sysvinit conditionals) are removed; OpenBMC-specific settings
# (phosphor distro features, wic+tar.xz image types) are added.
#
# Inheritance chain:
#   socfpga_armv8-2a.inc  (CPU/SoC arch — from meta-altera-bsp via BBPATH)
#       └── agilex3_openbmc.conf  (this file)

require conf/machine/include/socfpga_armv8-2a.inc

# ---------------------------------------------------------------------------
# Root home directory
# ---------------------------------------------------------------------------
ROOT_HOME = "/home/root"

# ---------------------------------------------------------------------------
# Machine name strip — used by meta-altera-bsp to locate the FIT ITS template.
# "agilex3" makes it find fit_agilex3_kernel.its (not fit_agilex3_openbmc_kernel.its).
# ---------------------------------------------------------------------------
MACHINE_STRIP = "agilex3"

# ---------------------------------------------------------------------------
# Boot source — SD card (mmc0) for Phase 0
# ---------------------------------------------------------------------------
SSBL_BOOT_SOURCE ??= "mmc0"

# ---------------------------------------------------------------------------
# U-Boot
# ---------------------------------------------------------------------------
UBOOT_CONFIG = "agilex3e-135b-socdk-atf"
UBOOT_CONFIG[agilex3e-135b-socdk-atf] = "${UBOOT_DEFCONFIG}"
UBOOT_DEFCONFIG ?= "socfpga_agilex3_defconfig"

KBUILD_DEFCONFIG ?= "defconfig"

UBOOT_BINARY  = "u-boot.itb"
UBOOT_SUFFIX  = "itb"
UBOOT_DEVICE_TREE ?= "socfpga_agilex3_socdk.dtb"

UBOOT_ENTRYPOINT  = "0x4000000"
UBOOT_LOADADDRESS = "0x4000000"

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------
KERNEL_IMAGETYPE = "Image"
FIT_KERNEL_COMP_ALG = "none"

# Base Linux DTS (from upstream kernel tree)
LINUX_DTS_FILE     ?= "socfpga_agilex3_socdk.dts"
LINUX_DTB_FILE     ?= "socfpga_agilex3_socdk.dtb"

# Custom (design-specific) DTS overlaid on top of the base DTS.
# Provided by meta-altera-bsp or the board-level meta layer.
CUSTOM_LINUX_DTS_FILE ?= ""

KERNEL_DEVICETREE ?= "intel/${LINUX_DTB_FILE}"

# ---------------------------------------------------------------------------
# Serial console
# ---------------------------------------------------------------------------
SERIAL_CONSOLES ?= "115200;ttyS0"

# ---------------------------------------------------------------------------
# Extra dependencies (from meta-altera-bsp)
# ---------------------------------------------------------------------------
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = " device-tree fpga-bitstream"

# Auto-load the ADI AXI fan-control hwmon driver so dbus-sensors / fansensor
# can discover /sys/class/hwmon/hwmonN/fan1_input and pwm1 from FPGA AXI fan IP.
KERNEL_MODULE_AUTOLOAD:append = " axi-fan-control"

EXTRA_IMAGEDEPENDS:append = " \
    u-boot-socfpga-scr \
    u-boot-socfpga-env-var \
    "

# ---------------------------------------------------------------------------
# OpenBMC / phosphor distro requirements
# ---------------------------------------------------------------------------
# Use dbus-sensors as the hwmon sensor daemon (discovers soc64-hwmon via
# entity-manager; creates D-Bus sensor objects with chassis associations so
# Redfish /Chassis/{id}/Sensors is populated).
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"

# Agilex3 is a hostless ARM BMC — use phosphor-state-manager for host/chassis
# state management instead of x86-power-control (which is Intel/x86-specific).
VIRTUAL-RUNTIME_obmc-host-state-manager    ?= "phosphor-state-manager-host"
VIRTUAL-RUNTIME_obmc-chassis-state-manager ?= "phosphor-state-manager-chassis"
VIRTUAL-RUNTIME_obmc-discover-system-state  = ""

DISTRO_FEATURES:append = " systemd usrmerge"

# ---------------------------------------------------------------------------
# SD card image (wic) — OpenBMC-specific layout
# 256 MB FAT boot + 1024 MB ext4 rootfs (sized for ~200-300 MB phosphor image)
# ---------------------------------------------------------------------------
WKS_FILE = "sdimage-agilex3-openbmc.wks"
IMAGE_FSTYPES = "wic tar.xz"

# wic build-time dependencies
do_image_wic[depends] += " \
    mtools-native:do_populate_sysroot \
    dosfstools-native:do_populate_sysroot \
    virtual/bootloader:do_deploy \
    virtual/kernel:do_deploy \
    "
